version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  # npm: Dependabot security updates only (no version PRs for this entry).
  # Grouped security bumps: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/customizing-dependabot-security-prs
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
